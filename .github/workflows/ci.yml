name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 — typecheck, lint, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Tope de warnings: 10 (bajado de 37 en la Etapa 0; el histórico está en
        # docs/REPORTE-REFACTOR.md, sección 5). No pueden crecer en silencio: si
        # un cambio agrega warnings, este paso falla. Los que quedan son 8
        # `set-state-in-effect` de la PWA y 2 `<img>`; bajarlos exige tocar React
        # o migrar a next/image, que es trabajo propio, no un agregado.
        run: npm run lint -- --max-warnings 10

      - name: Tests offline
        # `set -o pipefail` para que el exit code sea el de npm test y no el de
        # tee: sin eso, un fallo de tests pasaria por exito.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      # Deja la salida de los tests descargable. Sin esto, un fallo en CI era
      # imposible de diagnosticar desde aca (los logs de GitHub requieren ser
      # admin del repo) y habia que adivinar.
      - name: Subir log de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: warn

      - name: Build
        run: npm run build
