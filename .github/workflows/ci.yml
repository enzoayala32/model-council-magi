name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 — typecheck, lint, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Tope de warnings: hoy hay 42 y no pueden crecer en silencio. La
        # idea es bajarlo a medida que se limpia cada regla (ver deuda en
        # docs/REPORTE-REFACTOR.md, sección 5). Los 5 que agregó la Fase 3
        # son `set-state-in-effect` en hooks nuevos de la PWA, la misma
        # regla que ya acumulaba la app de escritorio.
                # Tope de warnings: hoy hay 37 (el mínimo desde que se habilitó el
        # lint). La idea es bajarlo a medida que se limpia cada regla (ver
        # deuda en docs/REPORTE-REFACTOR.md, sección 5).
        run: npm run lint -- --max-warnings 37

      - name: Tests offline
        run: npm test

      - name: Build
        run: npm run build
